[project]
name = "exam-backend"
version = "0.1.0"
description = "FastAPI backend with Firestore"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "firebase-admin",
    "pydantic-settings",
    "email-validator",
    "python-dotenv",
    "pdfminer.six",
    "pymupdf",
    "tabula-py",
    "pdfplumber",
    "pandas",
    "python-multipart",
    "JPype1",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "pytest-asyncio",
    "pytest-mock",
    "factory-boy",
    "pytest-cov",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DTZ", "PT", "SIM", "RET", "TCH"]
ignore = ["B008"]  # B008 conflicts with FastAPI's Depends()/File() argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
