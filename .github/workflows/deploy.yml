name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/255890529179/locations/global/workloadIdentityPools/github-actions/providers/exam-repos
          service_account: github-actions-deploy@examapp-d7995.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          mkdir -p deploy
          echo "${{ secrets.DEPLOY_ENV_YAML }}" | base64 -d > deploy/env.yaml
          gcloud run deploy exam-portal-api \
            --source . \
            --region europe-west1 \
            --project examapp-d7995 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 2 \
            --timeout 600 \
            --concurrency 80 \
            --env-vars-file deploy/env.yaml
